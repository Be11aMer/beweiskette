name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor declared in package.json engines, and is tested here
        # so that claim stays verified rather than assumed — an untested
        # `engines` field is how this job came to claim Node 18 support it
        # never had.
        #
        # Measured, not guessed: on 18.20.8 the suite produces 74 failures.
        # Node 18's test runner spawns child processes without
        # globalThis.crypto (the main process has it; the children do not,
        # unless --experimental-global-webcrypto is passed), and globalThis.File
        # is absent entirely. Node 20 passes all 197.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # The suite uses Node's built-in runner, so there is nothing to install
      # beyond the build tooling.
      #
      # `node --test` exits 0 when it discovers no test files at all, so a
      # refactor that moved or renamed the test directory would turn this job
      # green with nothing run — worse than a red build, because it is silent.
      # Hence the floor on the number of tests.
      #
      # Both reporters are named explicitly rather than relying on the default.
      # The default is a presentation choice and it changes: Node 20 and 22 emit
      # TAP when stdout is not a TTY, Node 24 emits spec. An earlier version of
      # this step parsed whatever the default produced and failed a green build
      # on Node 24 for that reason alone. spec goes to the log for humans; TAP
      # goes to a file for the check, so the machine-readable format is pinned
      # no matter what Node defaults to next.
      #
      # Writing TAP to a file rather than piping through tee also means this
      # step's exit code is npm's own, with no dependency on pipefail.
      - name: Run tests
        run: |
          npm test -- \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap  --test-reporter-destination=test-output.tap

          passed=$(grep -oE '^# pass [0-9]+' test-output.tap | tail -1 | grep -oE '[0-9]+')
          if [ "${passed:-0}" -lt 150 ]; then
            echo "::error::Only ${passed:-0} tests ran (expected at least 150). Test discovery is broken."
            exit 1
          fi
          echo "$passed tests passed."

      - run: npm run build

  no-runtime-dependencies:
    # The project's central constraint. A runtime dependency would need to be
    # a deliberate decision, not something that arrives with a pull request.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assert package.json declares no runtime dependencies
        run: |
          count=$(node -p "Object.keys(require('./package.json').dependencies || {}).length")
          if [ "$count" != "0" ]; then
            echo "::error::package.json declares $count runtime dependencies; this project must have none."
            node -p "JSON.stringify(require('./package.json').dependencies, null, 2)"
            exit 1
          fi
          echo "No runtime dependencies."

  no-inline-handlers-or-styles:
    # The CSP in public/_headers forbids inline styles, inline event handlers
    # and eval. Those break at runtime rather than at build time, so they are
    # checked here instead of being discovered in production.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject inline styles in application source
        run: |
          if grep -rn 'style="' src/ index.html --include='*.js' --include='*.html' \
             | grep -v '^src/report.js:'; then
            echo "::error::Inline style attributes require 'unsafe-inline' in style-src. Use a class."
            exit 1
          fi
      - name: Reject inline event handlers in application source
        run: |
          if grep -rnE '\son[a-z]+=' src/ index.html --include='*.js' --include='*.html' \
             | grep -v '^src/report.js:'; then
            echo "::error::Inline event handlers are blocked by script-src. Use addEventListener."
            exit 1
          fi
      - name: Reject eval and new Function in application source
        run: |
          if grep -rnE '\beval\(|new Function\(' src/ --include='*.js'; then
            echo "::error::eval/new Function require 'unsafe-eval' in script-src."
            exit 1
          fi
      - name: Reject untagged template literals assigned to innerHTML
        run: |
          if grep -rn 'innerHTML = `' src/ --include='*.js'; then
            echo "::error::Assign html\`...\` (the auto-escaping tag), never a bare template literal."
            exit 1
          fi
